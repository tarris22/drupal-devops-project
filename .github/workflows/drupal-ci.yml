name: Drupal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tarris22/drupal-devops-project

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Drupal image for testing
        run: docker build -t drupal-ci-test:local .

      - name: Start Drupal test container
        run: |
          docker run -d \
            --name drupal-ci-test \
            -p 8080:80 \
            drupal-ci-test:local

      - name: Run Drupal HTTP smoke test
        run: |
          echo "Waiting for Drupal to start..."

          for i in {1..45}; do
            STATUS=$(curl -s -o /dev/null \
              -w "%{http_code}" http://127.0.0.1:8080/ || true)

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              break
            fi

            sleep 2
          done

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            docker logs drupal-ci-test
            exit 1
          fi

          curl -sSI http://127.0.0.1:8080/ \
            | grep -i "^Location: /core/install.php" \
            || {
              echo "Expected Drupal installer redirect was not found."
              docker logs drupal-ci-test
              exit 1
            }

          echo "Drupal HTTP smoke test passed."

      - name: Clean up test container
        if: always()
        run: docker rm -f drupal-ci-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Drupal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
