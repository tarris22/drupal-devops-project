name: Drupal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tarris22/drupal-devops-project

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Drupal image for testing
        run: docker build -t drupal-ci-test:local .

      - name: Start Drupal test container
        run: |
          docker run -d \
            --name drupal-ci-test \
            -p 8080:80 \
            drupal-ci-test:local

      - name: Run Drupal HTTP smoke test
        run: |
          echo "Waiting for Drupal to start..."

          for i in {1..45}; do
            STATUS=$(curl -s -o /dev/null \
              -w "%{http_code}" http://127.0.0.1:8080/ || true)

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              break
            fi

            sleep 2
          done

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            docker logs drupal-ci-test
            exit 1
          fi

          curl -sSI http://127.0.0.1:8080/ \
            | grep -i "^Location: /core/install.php" \
            || {
              echo "Expected Drupal installer redirect was not found."
              docker logs drupal-ci-test
              exit 1
            }

          echo "Drupal HTTP smoke test passed."

      - name: Clean up test container
        if: always()
        run: docker rm -f drupal-ci-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Drupal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::244678446741:role/github-actions-drupal-deploy
          aws-region: eu-north-1

      - name: Deploy Drupal to isolated EC2 staging
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND=$(cat <<REMOTE
          set -eu

          IMAGE="ghcr.io/tarris22/drupal-devops-project:${IMAGE_TAG}"

          echo "Pulling tested Drupal image..."
          docker pull "\$IMAGE"

          echo "Replacing isolated staging container..."
          docker rm -f drupal-ci-staging 2>/dev/null || true

          docker run -d \
            --name drupal-ci-staging \
            --network drupal-test-net \
            -p 127.0.0.1:8082:80 \
            --restart unless-stopped \
            "\$IMAGE"

          echo "Waiting for container health..."

          HEALTH="starting"

          for i in \$(seq 1 90); do
            HEALTH=\$(docker inspect \
              --format='{{.State.Health.Status}}' \
              drupal-ci-staging 2>/dev/null || true)

            if [ "\$HEALTH" = "healthy" ]; then
              break
            fi

            sleep 2
          done

          if [ "\$HEALTH" != "healthy" ]; then
            docker logs --tail 50 drupal-ci-staging
            exit 1
          fi

          HTTP_STATUS=\$(curl -sS -o /dev/null \
            -w '%{http_code}' http://127.0.0.1:8082/ || true)

          echo "Staging HTTP status: \$HTTP_STATUS"

          case "\$HTTP_STATUS" in
            200|302)
              echo "Drupal staging deployment successful."
              ;;
            *)
              docker logs --tail 50 drupal-ci-staging
              exit 1
              ;;
          esac
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00050ec12a82fd282 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --comment "Deploy Drupal staging image ${IMAGE_TAG}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-00050ec12a82fd282 \
              --query Status \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              break
            fi

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-00050ec12a82fd282 \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Staging deployment failed."
            exit 1
          fi
