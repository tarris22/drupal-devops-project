name: Node.js CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'nodejs-app/**'
      - '.github/workflows/nodejs-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nodejs-app/**'
      - '.github/workflows/nodejs-ci-cd.yml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tarris22/nodejs-cloud-app

jobs:
  ci:
    name: Node.js Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: nodejs-app
        run: npm install

      - name: Run automated tests
        working-directory: nodejs-app
        run: npm test

      - name: Build Docker image
        run: docker build -t nodejs-cloud-app:test ./nodejs-app

  cd:
    name: AWS Continuous Deployment
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::244678446741:role/github-actions-drupal-deploy
          aws-region: eu-north-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Node.js image
        uses: docker/build-push-action@v6
        with:
          context: ./nodejs-app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Node.js to AWS using SSM
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          REMOTE_COMMAND=$(cat <<'REMOTE'
          set -e
          docker pull IMAGE_PLACEHOLDER
          docker rm -f nodejs-web || true
          docker run -d \
            --name nodejs-web \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            IMAGE_PLACEHOLDER
          sleep 10
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/health || true)
          echo "Node.js health status: $STATUS"
          test "$STATUS" = "200"
          REMOTE
          )
          REMOTE_COMMAND="${REMOTE_COMMAND//IMAGE_PLACEHOLDER/$IMAGE}"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-00050ec12a82fd282 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --comment "Deploy Node.js application" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-00050ec12a82fd282 \
              --query Status \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              echo "Node.js deployment successful."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-00050ec12a82fd282
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
