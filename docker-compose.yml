services:
  drupal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drupal-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DRUPAL_DB_HOST: database
    volumes:
      - drupal_data:/var/www/html
      - drupal_files:/var/www/html/sites/default/files
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$c=@fsockopen('127.0.0.1',80); if($$c){fclose($$c);exit(0);}exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  database:
    image: mysql:8.0
    container_name: drupal-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  drupal_data:
  drupal_files:
  mysql_data:
